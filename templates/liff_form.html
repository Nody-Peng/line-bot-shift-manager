<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>找代班申請</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #F8FAFC; color: #334155; }
        .input-style { transition: border-color 0.2s ease; }
        .input-style:focus { border-color: #64748B; outline: none; }
        .rc-item { display: none; }
        .rc-label {
            display: flex; align-items: center; gap: 10px;
            padding: 10px 14px; border: 1px solid #E2E8F0;
            cursor: pointer; transition: all 0.15s ease; background: white;
            border-radius: 2px;
        }
        .rc-item:checked + .rc-label {
            border-color: #475569; background-color: #475569; color: white;
        }
        .check-icon { display: none; width: 16px; height: 16px; flex-shrink: 0; }
        .rc-item:checked + .rc-label .check-icon { display: block; }
    </style>
</head>

<body class="p-6 flex flex-col items-center justify-center min-h-screen">
    <div id="mainContent" class="w-full max-w-md bg-white p-8 border border-slate-200">
        <header class="mb-8 border-b border-slate-100 pb-4">
            <h1 class="text-xl font-semibold text-slate-800">找代班申請</h1>
            <p class="text-slate-500 text-sm mt-1">請填寫詳細資訊，選擇要通知的對象</p>
        </header>

        <form id="subForm" class="space-y-6">
            <!-- 日期選擇 -->
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-2">請假日期</label>
                <input type="date" id="date" required
                    class="w-full px-4 py-3 border border-slate-200 input-style text-slate-700 appearance-none bg-white rounded-none">
            </div>

            <!-- 時段選擇 (複選) -->
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-2">時段 (可複選)</label>
                <div class="grid grid-cols-2 gap-3">
                    <label class="relative">
                        <input type="checkbox" name="time_slot" value="09:00 - 12:00" class="peer hidden">
                        <div class="cursor-pointer text-center py-3 border border-slate-200 peer-checked:border-slate-600 peer-checked:bg-slate-600 peer-checked:text-white transition-all text-sm font-medium text-slate-500">09:00 - 12:00</div>
                    </label>
                    <label class="relative">
                        <input type="checkbox" name="time_slot" value="12:00 - 14:00" class="peer hidden">
                        <div class="cursor-pointer text-center py-3 border border-slate-200 peer-checked:border-slate-600 peer-checked:bg-slate-600 peer-checked:text-white transition-all text-sm font-medium text-slate-500">12:00 - 14:00</div>
                    </label>
                    <label class="relative">
                        <input type="checkbox" name="time_slot" value="14:00 - 16:00" class="peer hidden">
                        <div class="cursor-pointer text-center py-3 border border-slate-200 peer-checked:border-slate-600 peer-checked:bg-slate-600 peer-checked:text-white transition-all text-sm font-medium text-slate-500">14:00 - 16:00</div>
                    </label>
                    <label class="relative">
                        <input type="checkbox" name="time_slot" value="16:00 - 18:00" class="peer hidden">
                        <div class="cursor-pointer text-center py-3 border border-slate-200 peer-checked:border-slate-600 peer-checked:bg-slate-600 peer-checked:text-white transition-all text-sm font-medium text-slate-500">16:00 - 18:00</div>
                    </label>
                    <label class="relative col-span-2">
                        <input type="checkbox" name="time_slot" value="09:00 - 17:00" class="peer hidden">
                        <div class="cursor-pointer text-center py-3 border border-slate-200 peer-checked:border-slate-600 peer-checked:bg-slate-600 peer-checked:text-white transition-all text-sm font-medium text-slate-500">09:00 - 17:00 (全天)</div>
                    </label>
                </div>
            </div>

            <!-- 理由 -->
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-2">請假理由</label>
                <textarea id="reason" rows="3" required placeholder="請簡述原因..."
                    class="w-full px-4 py-3 border border-slate-200 input-style text-slate-700 resize-none"></textarea>
            </div>

            <!-- 通知對象選擇 -->
            <div>
                <div class="flex items-center justify-between mb-2">
                    <label class="block text-sm font-medium text-slate-700">通知對象</label>
                    <div class="flex gap-3">
                        <button type="button" id="selectAllBtn" class="text-xs text-slate-500 underline hover:text-slate-700">全選</button>
                        <button type="button" id="clearAllBtn" class="text-xs text-slate-400 underline hover:text-slate-600">清除</button>
                    </div>
                </div>
                <div id="recipientList" class="space-y-2 max-h-56 overflow-y-auto border border-slate-100 p-2 bg-slate-50">
                    <p class="text-xs text-slate-400 text-center py-4">正在載入成員清單...</p>
                </div>
                <p class="text-xs text-slate-400 mt-1">勾選的成員會收到代班需求通知，可點擊接手。</p>
            </div>

            <button type="submit" id="submitBtn"
                class="w-full py-4 mt-4 bg-slate-600 hover:bg-slate-700 text-white font-medium text-sm transition-colors border border-transparent">
                確認發送
            </button>
        </form>
    </div>

    <!-- 成功/載入 Overlay -->
    <div id="successOverlay" class="hidden w-full max-w-md flex flex-col items-center justify-center"></div>

    <script>
        let currentUserId = null;

        async function initLIFF() {
            try {
                await liff.init({ liffId: "{{ liff_id }}" });
                if (!liff.isLoggedIn()) { liff.login(); return; }

                const profile = await liff.getProfile();
                currentUserId = profile.userId;

                const urlParams = new URLSearchParams(window.location.search);
                const action = urlParams.get('action');

                if (action === 'share') {
                    // 已由後端推播，直接顯示完成畫面
                    showSuccessScreen(0, true);
                } else {
                    const today = new Date().toISOString().split('T')[0];
                    const dateInput = document.getElementById('date');
                    dateInput.setAttribute('min', today);
                    dateInput.addEventListener('change', updateAvailableShifts);
                    loadRecipients();
                }
            } catch (err) {
                console.error("LIFF Init failed", err);
                alert("初始化失敗，請重新開啟");
            }
        }

        async function loadRecipients() {
            const list = document.getElementById('recipientList');
            try {
                const res = await fetch('/api/get-notify-targets');
                const data = await res.json();
                list.innerHTML = '';

                if (!data.targets || data.targets.length === 0) {
                    list.innerHTML = '<p class="text-xs text-slate-400 text-center py-4">尚無其他已綁定成員</p>';
                    return;
                }

                const others = data.targets.filter(t => t.id !== currentUserId);
                if (others.length === 0) {
                    list.innerHTML = '<p class="text-xs text-slate-400 text-center py-4">目前您是唯一的成員</p>';
                    return;
                }

                others.forEach(target => {
                    const uid = 'rc_' + target.id.replace(/[^a-zA-Z0-9]/g, '_');
                    const item = document.createElement('div');
                    const isGroup = target.type === 'group';
                    item.innerHTML = `
                        <input type="checkbox" class="rc-item" id="${uid}" name="notify_target" value="${target.id}">
                        <label class="rc-label" for="${uid}" style="${isGroup ? 'background:#f0f4ff;border-color:#c7d2fe;' : ''}">
                            <svg class="check-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"/>
                            </svg>
                            <span class="text-sm font-medium">${target.name}</span>
                            ${isGroup ? '<span style="font-size:10px;margin-left:auto;opacity:0.6">群組</span>' : ''}
                        </label>`;
                    list.appendChild(item);
                });

                document.getElementById('selectAllBtn').onclick = () => {
                    document.querySelectorAll('input[name="notify_target"]').forEach(cb => cb.checked = true);
                };
                document.getElementById('clearAllBtn').onclick = () => {
                    document.querySelectorAll('input[name="notify_target"]').forEach(cb => cb.checked = false);
                };
            } catch (err) {
                console.error("Load recipients error:", err);
                list.innerHTML = '<p class="text-xs text-red-400 text-center py-4">載入失敗，請重新開啟</p>';
            }
        }

        async function updateAvailableShifts() {
            const selectedDate = document.getElementById('date').value;
            const inputs = document.querySelectorAll('input[name="time_slot"]');
            inputs.forEach(input => {
                input.nextElementSibling.classList.add('opacity-30');
                input.disabled = true; input.checked = false;
                input.nextElementSibling.classList.remove('border-green-500', 'text-green-700');
            });
            try {
                const res = await fetch(`/api/get-my-shifts?date=${selectedDate}&userId=${currentUserId}`);
                const data = await res.json();
                const myShifts = data.shifts || [];
                inputs.forEach(input => {
                    if (myShifts.includes(input.value)) {
                        input.nextElementSibling.classList.remove('opacity-30');
                        input.nextElementSibling.classList.add('border-green-500', 'text-green-700');
                        input.disabled = false;
                    }
                });
                if (myShifts.length === 0) alert("系統提示：您在該日期沒有排班，或班表尚未發布。");
            } catch (err) { console.error("Fetch shifts error:", err); }
        }

        function showSuccessScreen(count, isAlreadySent = false) {
            document.getElementById('mainContent').classList.add('hidden');
            const overlay = document.getElementById('successOverlay');
            overlay.classList.remove('hidden');
            const msg = isAlreadySent
                ? '代班需求已發送<br>選擇的成員已收到通知'
                : `已發送 ${count} 筆代班需求<br>選擇的成員已收到通知`;
            overlay.innerHTML = `
                <div class="flex flex-col items-center space-y-4 p-10 text-center bg-white border border-slate-200 w-full">
                    <div class="w-16 h-16 bg-slate-100 rounded-full flex items-center justify-center">
                        <svg class="h-8 w-8 text-slate-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>
                        </svg>
                    </div>
                    <h2 class="text-lg font-semibold text-slate-800">申請成功！</h2>
                    <p class="text-sm text-slate-500">${msg}</p>
                    <button onclick="liff.closeWindow()"
                        class="mt-4 px-8 py-3 bg-slate-600 text-white text-sm font-medium hover:bg-slate-700 transition-colors">
                        關閉視窗
                    </button>
                </div>`;
        }

        document.getElementById('subForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const selectedSlots = Array.from(document.querySelectorAll('input[name="time_slot"]:checked')).map(cb => cb.value);
            if (selectedSlots.length === 0) { alert("請至少選擇一個時段"); return; }

            const notifyTargets = Array.from(document.querySelectorAll('input[name="notify_target"]:checked')).map(cb => cb.value);

            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = true;
            submitBtn.textContent = '處理中...';

            try {
                const context = liff.getContext();
                const payload = {
                    date: document.getElementById('date').value,
                    time_slots: selectedSlots,
                    reason: document.getElementById('reason').value,
                    userId: currentUserId,
                    groupId: (context && (context.groupId || context.roomId)) || null,
                    notify_targets: notifyTargets
                };

                const response = await fetch('/api/submit-sub', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (response.ok) {
                    const result = await response.json();
                    showSuccessScreen(result.count);
                } else {
                    const errData = await response.json();
                    throw new Error(errData.detail || '伺服器處理失敗');
                }
            } catch (err) {
                console.error("Submit error:", err);
                alert("發生錯誤：" + err.message);
                submitBtn.disabled = false;
                submitBtn.textContent = '確認發送';
            }
        });

        initLIFF();
    </script>
</body>

</html>
